openapi: 3.0.0
servers:
  - url: "http://localhost:3000"
info:
  title: Telegrammo
  description: Telegrammo's API
  version: 1.0.0
paths:
  /user:
    post:
      tags: ["login"]
      operationId: doLogin
      summary: "login"
      description: "logs in the user if it exists, otherwise creates it"
      requestBody: 
        description: "username"
        content:
          application/json: 
            schema: 
              description: "username"
              type: object
              properties:
                username:
                  type: string
                  minLength: 1
                  maxLength: 16
                  pattern: ^[a-zA-Z0-9]+$
                  example: "pippobaudo12"
      responses: 
        "200": 
          description: "user logged in"
          content:
            application/json:
              schema:
                description: "return id"
                type: object
                properties:
                  identifier: 
                    type: integer
                    minimum: 1
                    maximum: 10000
                    example: 124
        "400":
          $ref: "#/components/responses/Bad_Input"
        "500":
          $ref: "#/components/responses/500_ISE"
  /user/name:
    put:
      tags: ["user"]
      security:
        - bearerAuth: []
      
      operationId: setMyUserName
      summary: "modify username"
      description: "first check that the user's username is not duplicated, then change it"
      requestBody: 
        description: "take new username"
        content:
          application/json: 
            schema: 
              description: "new username"
              type: object
              properties:
                
                username:
                  type: string
                  minLength: 1
                  maxLength: 16
                  pattern: ^[a-zA-Z0-9]+$
                  example: "pippobaudo12"
      responses: 
        "204": 
          $ref: "#/components/responses/204_NoContent"
        "400":
          $ref: "#/components/responses/Bad_Input"
        "401":
          $ref: "#/components/responses/401_Unauthorized"
        "409":
          $ref: "#/components/responses/409_Conflict"
        "500":
          $ref: "#/components/responses/500_ISE"
  /user/photo:
    put:
      tags: ["user"]
      security:
        - bearerAuth: []
      operationId: setMyPhoto
      summary: "modify photo"
      description: "if the user has not set a photo then set it, otherwise change it"
      requestBody:
        description: "the photo is taken"
        content:
          multipart/form-data: 
            schema:
              description: "profile photo"
              type: object
              properties:
                photo: 
                  type: string
                  format: binary
      responses:
        "204": 
          $ref: "#/components/responses/204_NoContent"
        "400":
          $ref: "#/components/responses/Bad_Input"
        "401":
          $ref: "#/components/responses/401_Unauthorized"
        "500":
          $ref: "#/components/responses/500_ISE"    
  /users/{id}:
    get:
      tags: ["user"]
      security:
        - bearerAuth: []
      operationId: getMyUser
      summary: "give all the user's parameters"
      description: "give all the user's parameters(id, username, propic)"
      parameters:
        - name: id
          in: path
          required: true
          description: "user id"
          schema:
            description: "user id"
            type: integer
            minimum: 1
            maximum: 10000
            example: 1
      responses:
        "200":
          description: "return username, propic and id"
          content:
            application/json:
              schema:
                description: "return a user object"
                $ref: "#/components/schemas/user"
        "400":
          $ref: "#/components/responses/Bad_Input"
        "401":
          $ref: "#/components/responses/401_Unauthorized"
        "500":
          $ref: "#/components/responses/500_ISE"
  /conversation: 
    post:
      tags: ["conversation"]
      security:
        - bearerAuth: []
      operationId: createChat
      summary: "create a chat"
      description: "if the chat already exists it does not create it, otherwise it creates it"
      requestBody:
        description: "chat data"
        content:
          application/json:
            schema:
              description: "participant"
              type: object
              properties:
                id: 
                  description: "user id"
                  type: integer
                  minimum: 1
                  maximum: 10000
                  example: 13  
      responses:
        "200": 
          description: "chat create successfully"
          content:
            application/json:
              schema:
                description: "return id chat"
                type: object
                properties:
                  identifier: 
                    type: integer
                    minimum: 1
                    maximum: 10000
                    example: 124
        "400":
          $ref: "#/components/responses/Bad_Input"
        "401":
          $ref: "#/components/responses/401_Unauthorized"
        "409":
          $ref: "#/components/responses/409_Conflict"
        "500":
          $ref: "#/components/responses/500_ISE"
  /search/users/{username}:
    get:  
      tags: ["user"]
      security:
        - bearerAuth: []
      operationId: checknames
      summary: "takes some users"
      description: "gives all the user's parameters(id, username, propic) that username input is substring of username"
      parameters:
        - name: username
          in: path
          required: true
          description: "username to find"
          schema:
            description: "username to find"
            type: string
            minLength: 1
            pattern: ^[a-zA-Z0-9]+$
            maxLength: 16
            example: "giorgio"
      responses:
        "200":
          description: "return username, propic and id of all users who meet the requirement "
          content:
            application/json:
              schema:
                description: "return a user array object"
                type: array
                maxItems: 10000
                minItems: 1
                items: 
                  $ref: "#/components/schemas/user"
        "400":
          $ref: "#/components/responses/Bad_Input"
        "401":
          $ref: "#/components/responses/401_Unauthorized"
        "404":
          $ref: "#/components/responses/404_NotFound"
        "500":
          $ref: "#/components/responses/500_ISE"
  /search/chat/{nomeChat}:
    get:
      tags: ['conversation']
      security:
        - bearerAuth: []
      operationId: checkChatNames
      summary: "take some chats"
      description: "takes all the chat's parameters that username input is substring of chat"
      parameters:
        - name: nomeChat
          in: path
          required: true
          description: "chat to find"
          schema:
            description: "chat to find"
            type: string
            minLength: 1
            pattern: ^[a-zA-Z0-9]+$
            maxLength: 16
            example: "giorgio"
      responses:
        "200": 
          description: "return found chats"
          content:
            application/json:
              schema:
                description: "return a ChatUtente object"
                type: array
                maxItems: 10000
                minItems: 1
                items:
                  $ref: "#/components/schemas/ChatUtente"
        "400":
          $ref: "#/components/responses/Bad_Input"
        "401":
          $ref: "#/components/responses/401_Unauthorized"
        "404":
          $ref: "#/components/responses/404_NotFound"
        "500":
          $ref: "#/components/responses/500_ISE"
  /conversations:
    get:
      tags: ["conversation"]
      security:
        - bearerAuth: []
      operationId: getMyConversations
      summary: "get current user chat"
      description: "get current user chats and groups after authentication "
      responses:
        "200":
          description: "return all user's chats"
          content:
            application/json:
              schema:
                description: "return a ChatUtente array object"
                type: array
                maxItems: 10000
                minItems: 1
                items:
                  $ref: "#/components/schemas/ChatUtente"
        "401":
          $ref: "#/components/responses/401_Unauthorized"
        "500":
          $ref: "#/components/responses/500_ISE"
  /conversation/{idChat}:
    get:
      tags: ["conversation"]
      security:
        - bearerAuth: []
      operationId: getConversation
      summary: "get chat or group"
      description: "get the messages of chat or group after authentication"
      parameters:
        - name: idChat
          in: path
          required: true
          description: "chat id"
          schema:
            description: "chat id"
            type: integer
            minimum: 1
            maximum: 10000
            example: 1
      responses:
        "200":
          description: "return all chat's messages"
          content:
            application/json:
              schema:
                description: "return a Mess array object"
                type: array
                maxItems: 10000
                minItems: 1
                items:
                  $ref: "#/components/schemas/Mess"
        "401":
          $ref: "#/components/responses/401_Unauthorized"
        "404":
          $ref: "#/components/responses/404_NotFound"
        "500":
          $ref: "#/components/responses/500_ISE"
  /conversation/group:
    post: 
      tags: ["conversation"]
      security:
        - bearerAuth: []
      operationId: createGroup
      summary: "create a group"
      description: "create a group and insert the logged user and the other users"
      requestBody:
        description: "group data"
        content:
          multipart/form-data:
            schema:
              description: "take the parameters for create the group"
              type: object
              properties:
                propic: 
                  type: string
                  format: binary
                  description: "group propic"
                nome_chat:
                  type: string
                  description: "group name"
                  minLength: 1
                  maxLength: 16
                  example: "gruppo"
                  pattern: ^[a-zA-Z0-9]+$
                membri: 
                  type: array
                  default: []
                  minItems: 0
                  maxItems: 10000
                  items:                    
                    type: integer
                    minimum: 1
                    maximum: 10000
                    example: 1
      responses:
        "200":
          description: "group create successfully"
          content:
            application/json:
              schema:
                description: "return id group"
                type: object
                properties:
                  id_group: 
                    type: integer
                    minimum: 1
                    maximum: 10000
                    example: 124
        "400":
          $ref: "#/components/responses/Bad_Input"
        "401":
          $ref: "#/components/responses/401_Unauthorized"
        "500":
          $ref: "#/components/responses/500_ISE"
  /conversation/leave/{idChat}:
    delete:
      tags: ["conversation"]
      security:
        - bearerAuth: []
      summary: "Leave a group"
      description: "Leave a group by logged user"
      operationId: leaveGroup
      parameters:
        - name: idChat
          in: path
          required: true
          description: "group identifier"
          schema:
                type: integer
                minimum: 1
                maximum: 10000
                example: 1
      responses:
        "204":
          $ref: "#/components/responses/204_NoContent"
        "400":
          $ref: "#/components/responses/Bad_Input"
        "401":
          $ref: "#/components/responses/401_Unauthorized"
        "500":
          $ref: "#/components/responses/500_ISE"
  /conversation/group/name:
    put:
      tags: ["conversation"]
      security:
        - bearerAuth: []
      operationId: setGroupName
      summary: "modify group name"
      description: "if the user belong to the group modify the group name, otherwise return an error"
      requestBody:
        description: "take group id and chat name"
        content:
          application/json: 
            schema:
              description: "the new chat name and the group id of the chat"
              type: object
              properties:
                id_chat:
                  description: "the group id to modify"
                  type: integer
                  minimum: 0
                  maximum: 10000
                  example: 1
                nome_chat:
                  description: "the chat new name"
                  type: string
                  pattern: ^[a-zA-Z0-9]+$
                  minLength: 1
                  maxLength: 16
                  example: "pippo"
      responses:
        "204":
          $ref: "#/components/responses/204_NoContent"
        "400":
          $ref: "#/components/responses/Bad_Input"
        "401":
          $ref: "#/components/responses/401_Unauthorized"
        "500":
          $ref: "#/components/responses/500_ISE"              
  /conversation/group/user:
    put:
      tags: ["conversation"]
      security:
        - bearerAuth: []
      operationId: addToGroup
      summary: "add user to group"
      description: "if the user belong to the group add the user/s to the group, otherwise return an error"
      requestBody:
        description: "take the group id and chat memebers to add"
        content:
          application/json: 
            schema:
              description: "new group member/s and chat id"
              type: object
              properties:
                membri:
                  description: "new group member/s(id)"
                  type: array
                  default: []
                  minItems: 1
                  maxItems: 10000
                  items:                   
                    type: integer
                    minimum: 1
                    maximum: 10000
                    example: 1
                id_chat:
                  type: integer
                  description: "chat id to the group that is needed to add members"
                  minimum: 1
                  maximum: 10000
                  example: 1   
      responses:
        "204":
          $ref: "#/components/responses/204_NoContent"
        "400":
          $ref: "#/components/responses/Bad_Input"
        "401":
          $ref: "#/components/responses/401_Unauthorized"
        "500":
          $ref: "#/components/responses/500_ISE"            
  /conversation/group/photo:
    put:
      tags: ["conversation"]
      security:
        - bearerAuth: []
      operationId: setGroupPhoto
      summary: "set group photo"
      description: "if the user belong to the group set the group photo, otherwise return an error"
      requestBody:
        description: "take the group id and the photo"
        content:
          multipart/form-data:
            schema:
              description: "new photo and chat id"
              type: object
              properties:
                propic:
                  description: "the photo that will be set" 
                  type: string
                  format: binary
                id_chat:
                  type: integer
                  description: "chat id to the group that is needed to change photo"
                  minimum: 1
                  maximum: 10000
                  example: 1   
      responses:
        "204":
          $ref: "#/components/responses/204_NoContent"
        "400":
          $ref: "#/components/responses/Bad_Input"
        "401":
          $ref: "#/components/responses/401_Unauthorized"
        "500":
          $ref: "#/components/responses/500_ISE"        
  /message:
    post: 
      tags: ["message"]
      security:
        - bearerAuth: []
      operationId: sendMessage
      summary: "send a message"
      description: "send a message if the user belong to the chat, otherwise return an error"
      requestBody:
        description: "message data"
        content:
          multipart/form-data:  
            schema:
              description: "message data"
              type: object
              properties:
                photo:
                  description: "photo of the message to be sent"
                  type: string 
                  format: binary
                id_chat:
                  description: "chat id where the message should be sent"
                  type: integer
                  minimum: 1
                  maximum: 10000
                  example: 1
                testo: 
                  description: "message text"
                  type: string
                  pattern: ^[a-zA-Z0-9]+$
                  minLength: 0
                  maxLength: 10000
                  example: "ciao, sono alessio"
                id_reply:
                  description: "the id of the message we are replying to"
                  type: integer
                  minimum: 1
                  maximum: 10000
                  example: 1
      responses:
        "204":
          $ref: "#/components/responses/204_NoContent"
        "400":
          $ref: "#/components/responses/Bad_Input"
        "401":
          $ref: "#/components/responses/401_Unauthorized"
        "500":
          $ref: "#/components/responses/500_ISE"
  /message/forward:
    post: 
      tags: ["message"]
      security:
        - bearerAuth: []
      operationId: forwardMessage
      summary: "forward a message"
      description: "forward the message if the logged in user has access to the message and the sending chat "
      requestBody:
        description: "information for forward the message"
        content:
          application/json:
            schema:
              description: "forward data"
              type: object
              properties:
                id_chat: 
                  description: "chat id where the message will be sent"
                  type: array
                  minItems: 1
                  maxItems: 10000
                  items:
                    type: integer
                    minimum: 1
                    maximum: 10000
                    example: 1
                id_mes:
                  type: integer
                  description: "message id"
                  minimum: 1
                  maximum: 10000
                  example: 1
                id_for: 
                  description: "forward id(message sender id)"
                  type: integer
                  minimum: 1
                  maximum: 10000
                  example: 1
      responses:
        "204":
          $ref: "#/components/responses/204_NoContent"
        "400":
          $ref: "#/components/responses/Bad_Input"
        "401":
          $ref: "#/components/responses/401_Unauthorized"
        "500":
          $ref: "#/components/responses/500_ISE"
  /message/comment:
    post:
      tags: ["message"]
      security:
        - bearerAuth: []
      operationId: commentMessage
      summary: "comment a message"
      description: "comment the message if the logged in user has access to the message, and if he has already entered the comment he changes it(if you click the comment already inserted it removes the comment)"
      requestBody:
        description: "information for comment the message"
        content:
          application/json:
            schema:
              description: "message and comment data"
              type: object
              properties:
                id_chat: 
                  description: "chat id where the message will be commented"
                  type: integer
                  minimum: 1
                  maximum: 10000
                  example: 1
                id_mes:
                  type: integer
                  description: "message id of the message that will be commented"
                  minimum: 1
                  maximum: 10000
                  example: 1
                emoji: 
                  description: "the effective comment to the message"
                  type: string
                  maxLength: 1
                  minLength: 1
                  pattern: ^(👠|❤️|👍🏻|👌🏻|💅)$
                  example: "❤️"
      responses:
        "204":
          $ref: "#/components/responses/204_NoContent"
        "400":
          $ref: "#/components/responses/Bad_Input"
        "401":
          $ref: "#/components/responses/401_Unauthorized"
        "500":
          $ref: "#/components/responses/500_ISE"      
  /message/uncomment:
    post:
      tags: ["message"]
      security:
        - bearerAuth: []
      operationId: uncommentMessage
      summary: "uncomment a message"
      description: "uncomment the message if the logged in user has access to the message"
      requestBody:
        description: "information for comment the message"
        content:
          application/json:
            schema:
              description: "message data"
              type: object
              properties:
                id_chat: 
                  description: "chat id where the message will be uncommented"
                  type: integer
                  minimum: 1
                  maximum: 10000
                  example: 1
                id_mes:
                  type: integer
                  description: "message id of the message that will be uncommented"
                  minimum: 1
                  maximum: 10000
                  example: 1
      responses:
        "204":
          $ref: "#/components/responses/204_NoContent"
        "400":
          $ref: "#/components/responses/Bad_Input"
        "401":
          $ref: "#/components/responses/401_Unauthorized"
        "500":
          $ref: "#/components/responses/500_ISE"
  /message/delete/{idMes}:
    delete:
      tags: ["message"]
      security:
        - bearerAuth: []
      summary: "delete a message"
      description: "check the existence of the message and if it exists delete it(if it's forwarded delete only the chat instance)"
      operationId: deleteMessage
      parameters:
        - name: idMes
          in: path
          required: true
          description: "message id"
          schema:
            type: integer
            minimum: 1
            maximum: 10000
            example: 1
      requestBody:
        description: "information for delete the message"
        content:
          application/json: 
            schema:
              description: "message data"
              type: object
              properties:
                id_chat: 
                  description: "chat id where the message will be deleted"
                  type: integer
                  minimum: 1
                  maximum: 10000
                  example: 1
                id_forward:
                  type: integer
                  description: "id of the forward of the message(id messaggi_di_chat)"
                  minimum: 1
                  maximum: 10000
                  example: 1
      
      responses:
        "204":
          $ref: "#/components/responses/204_NoContent"
        "400":
          $ref: "#/components/responses/Bad_Input"
        "401":
          $ref: "#/components/responses/401_Unauthorized"
        "500":
          $ref: "#/components/responses/500_ISE"
components:
  schemas:
    id: 
      description: "user id"
      type: integer
      minimum: 1
      maximum: 10000
      example: 1
    username:
      description: "user username"
      type: string
      minLength: 1
      maxLength: 16
      example: pippo
      pattern: ^[a-zA-Z0-9]+$
    propic:
      description: "user profile photo"
      type: string
      format: binary
    user:
      description: "type user object with username, id and propic inside"
      type: object
      properties:
        id:
          $ref: "#/components/schemas/id"
        username:
          $ref: "#/components/schemas/username"
        propic:
          $ref: "#/components/schemas/propic"
    Group:
      type: object
      properties:
        NomeChat:
          description: "chat name"
          type: string
          pattern: ^[a-zA-Z0-9]+$
          maxLength: 16
          minLength: 1
          example: "pluto"
        Propric:
          description: "group propic"
          type: string
          format: binary
        Membri:
          description: "group members id"
          type: array
          minItems: 1
          maxItems: 10000
          items:
            type: integer
            minimum: 1
            maximum: 10000
            example: 1
        IdChat:
          description: "chat(group) id"
          type: integer
          minimum: 1
          maximum: 10000
          example: 1
    ChatUtente:
      type: object
      properties:
        IdChat:
          description: "chat id"
          type: integer
          minimum: 1
          maximum: 10000
          example: 1
        Nome:
          description: "chat name"
          type: string
          maxLength: 16
          minLength: 1
          example: "pippo"
        Gruppo:
          description: "true if the chat is a group, otherwise false"
          type: boolean
          example: true
        Username:
          description: "user username who has send the last message to the chat"
          type: string
          pattern: ^[a-zA-Z0-9]+$
          maxLength: 16
          minLength: 1
          example: "paolino"
        Id: 
          description: "user id who has send the last message to the chat"
          type: integer
          minimum: 1
          maximum: 10000
          example: 1
        Propic:
          description: "chat profile picture"
          type: string
          format: binary
        LastMsg:
          description: "last message text"
          type: string
          pattern: ^[a-zA-Z0-9]+$
          maxLength: 100
          minLength: 0
          example: "ciao come ti chiami?$"
        Data:
          description: "last message date"
          type: string
          format: date-time
          minLength: 20
          maxLength: 30
          example: "2021-06-01T10:00:00Z"
    Mess:
      type: object
      properties:
        IdMess:
          description: "message id"
          type: integer
          minimum: 1
          maximum: 10000
          example: 1
        Nome:
          description: "sender username"
          type: string 
          pattern: ^[a-zA-Z0-9]+$
          minLength: 1
          maxLength: 16
          example: "pippo"
        IdMitt:
          description: "sender id"
          type: integer
          minimum: 1
          maximum: 10000
          example: 1 
        Testo:
          description: "message text"
          type: string
          pattern: ^[a-zA-Z0-9]+$
          minLength: 0
          maxLength: 10000
          example: "ciao, sono pippo"
        Data:
          description: "date of message sent"
          type: string
          format: date-time
          minLength: 20
          maxLength: 30
          example: "2021-06-01T10:00:00Z"
        Visual:
          description: "if the message was viewed"
          type: boolean 
          example: true
        Photo:
          description: "photo in send message"
          type: string
          format: binary
        IdChat:
          description: "chat id"
          type: integer
          minimum: 1
          maximum: 10000
          example: 1
        Gruppo:
          description: "if the message belongs to a group"
          type: boolean
          example: true
        Emoji:
          description: "array of 5 elements, the number of each indicates how many emojis that message has for each type of emoji"
          type: array
          minItems: 1
          maxItems: 10000
          items:
            type: integer
        MyEmoji:
          description: "indicates the emoji of the user logged in to that message"
          type: string
          pattern: ^(👠|❤️|👍🏻|👌🏻|💅)$
          minLength: 1
          maxLength: 30
          example: "❤️"
        ForwardUsername:
          description: "username of the user who created the message to be forwarded"
          type: string
          pattern: ^[a-zA-Z0-9]+$
          minLength: 1
          maxLength: 16
          example: "pippo"
        ForwardId:
          description: "id of the user who created the message to be forwarded"
          type: integer
          minimum: 1
          maximum: 10000
          example: 1
        ForwardDate:
          description: "forward date"
          type: string
          format: date-time
          minLength: 20
          maxLength: 30
