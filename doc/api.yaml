openapi: 3.0.0
servers:
  - url: "http://localhost:3000"
info:
  title: Telegrammo
  description: le API di Telegrammo
  version: 1.0.0
paths:
  /user:
    post:
      tags: ["login"]
      operationId: doLogin
      summary: "login"
      description: "logs in the user if it exists, otherwise creates it"
      requestBody: 
        description: "username"
        content:
          application/json: 
            schema: 
              description: "username"
              type: object
              properties:
                
                username:
                  type: string
                  minLength: 1
                  maxLength: 16
                  pattern: ^[a-zA-Z0-9]+$
                  example: "pippobaudo12"
      responses: 
        "200": 
          description: "user logged in"
          content:
            application/json:
              schema:
                description: "return id"
                type: object
                properties:
                  identifier: 
                    type: integer
                    minimum: 1
                    maximum: 10000
                    example: 124
        "400":
          $ref: "#/components/responses/Bad_Input"
        "500":
          $ref: "#/components/responses/500_ISE"
  /user/name:
    put:
      tags: ["user"]
      security:
        - bearerAuth: []
      
      operationId: setMyUserName
      summary: "modify username"
      description: "first check that the user's username is not duplicated, then change it"
      requestBody: 
        description: "take new username"
        content:
          application/json: 
            schema: 
              description: "new username"
              type: object
              properties:
                
                username:
                  type: string
                  minLength: 1
                  maxLength: 16
                  pattern: ^[a-zA-Z0-9]+$
                  example: "pippobaudo12"
      responses: 
        "200": 
          description: "username changed"
        "400":
          $ref: "#/components/responses/Bad_Input"
        "401":
          $ref: "#/components/responses/401_Unauthorized"
        "409":
          $ref: "#/components/responses/409_Conflict"
        "500":
          $ref: "#/components/responses/500_ISE"
  /user/photo:
    put:
      tags: ["user"]
      security:
        - bearerAuth: []
      operationId: setMyPhoto
      summary: "modify photo"
      description: "if the user has not set a photo then set it, otherwise change it"
      requestBody:
        description: "the photo is taken"
        content:
          multipart/form-data: 
            schema:
              description: "profile photo"
              type: object
              properties:
                photo: 
                  type: string
                  format: binary
      responses:
        "204": 
          $ref: "#/components/responses/204_NoContent"
        "400":
          $ref: "#/components/responses/Bad_Input"
        "401":
          $ref: "#/components/responses/401_Unauthorized"
        "500":
          $ref: "#/components/responses/500_ISE"    
  /users/{id}:
    get:
      tags: ["user"]
      security:
        - bearerAuth: []
      operationId: getMyUser
      summary: "give all the user's parameters"
      description: "give all the user's parameters(id, username, propic)"
      parameters:
        - name: id
          in: path
          required: true
          description: "user id"
          schema:
            description: "user id"
            type: integer
            minimum: 1
            maximum: 10000
            example: 1
      responses:
        "200":
          description: "return username, propic and id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/user"
        "400":
          $ref: "#/components/responses/Bad_Input"
        "401":
          $ref: "#/components/responses/401_Unauthorized"
        "500":
          $ref: "#/components/responses/500_ISE"
  /conversation: 
    post:
      tags: ["conversation"]
      security:
        - bearerAuth: []
      operationId: createChat
      summary: "create a chat"
      description: "if the chat already exists it does not create it, otherwise it creates it"
      requestBody:
        description: "chat data"
        content:
          application/json:
            schema:
              description: "participant"
              type: object
              properties:
                id: 
                  description: "user id"
                  type: integer
                  minimum: 1
                  maximum: 10000
                  example: 13  
      responses:
        "200": 
          description: "chat create successfully"
          content:
            application/json:
              schema:
                description: "return id chat"
                type: object
                properties:
                  identifier: 
                    type: integer
                    minimum: 1
                    maximum: 10000
                    example: 124
        "400":
          $ref: "#/components/responses/Bad_Input"
        "401":
          $ref: "#/components/responses/401_Unauthorized"
        "409":
          $ref: "#/components/responses/409_Conflict"
        "500":
          $ref: "#/components/responses/500_ISE"
  /search/users/{username}:
    get:  
      tags: ["user"]
      security:
        - bearerAuth: []
      operationId: checknames
      summary: "takes some users"
      description: "gives all the user's parameters(id, username, propic) that username input is substring of username"
      parameters:
        - name: username
          in: path
          required: true
          description: "username to find"
          schema:
            description: "username to find"
            type: string
            minLength: 1
            pattern: ^[a-zA-Z0-9]+$
            maxLength: 16
            example: "giorgio"
      responses:
        "200":
          description: "return username, propic and id of all users who meet the requirement "
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/user"
        "400":
          $ref: "#/components/responses/Bad_Input"
        "401":
          $ref: "#/components/responses/401_Unauthorized"
        "404":
          $ref: "#/components/responses/404_NotFound"
        "500":
          $ref: "#/components/responses/500_ISE"
  /search/chat/{nomeChat}:
    get:
      tags: ['conversation']
      security:
        - bearerAuth: []
      operationId: checkChatNames
      summary: "take some chats"
      description: "takes all the chat's parameters that username input is substring of chat"
      parameters:
        - name: nomeChat
          in: path
          required: true
          description: "chat to find"
          schema:
            description: "chat to find"
            type: string
            minLength: 1
            pattern: ^[a-zA-Z0-9]+$
            maxLength: 16
            example: "giorgio"
      responses:
        "200": 
          description: "return found chats"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChatUtente"
        "400":
          $ref: "#/components/responses/Bad_Input"
        "401":
          $ref: "#/components/responses/401_Unauthorized"
        "404":
          $ref: "#/components/responses/404_NotFound"
        "500":
          $ref: "#/components/responses/500_ISE"
  /conversations:
    get:
      tags: ["conversation"]
      security:
        - bearerAuth: []
      operationId: getMyConversations
      summary: "get current user chat"
      description: "get current user chats and groups after authentication "
      responses:
        "200":
          description: "return all user's chats"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChatUtente"
        "401":
          $ref: "#/components/responses/401_Unauthorized"
        "500":
          $ref: "#/components/responses/500_ISE"
  /conversation/{idChat}:
    get:
      tags: ["conversation"]
      security:
        - bearerAuth: []
      operationId: getConversation
      summary: "get chat or group"
      description: "get the messages of chat or group after authentication"
      parameters:
        - name: idChat
          in: path
          required: true
          description: "chat id"
          schema:
            description: "chat id"
            type: integer
            minimum: 1
            maximum: 10000
            example: 1
      responses:
        "200":
          description: "return all chat's messages"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Mess"
        "401":
          $ref: "#/components/responses/401_Unauthorized"
        "404":
          $ref: "#/components/responses/404_NotFound"
        "500":
          $ref: "#/components/responses/500_ISE"
  /conversation/group:
    post: 
      tags: ["conversation"]
      security:
        - bearerAuth: []
      operationId: createGroup
      summary: "create a group"
      description: "create a group and insert the logged user and the other users"
      requestBody:
        description: "group data"
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                propic: 
                  type: string
                  format: byte
                  description: "group propic"
                nome_chat:
                  type: string
                  description: "group name"
                  minLength: 1
                  maxLength: 16
                  example: "gruppo"
                membri: 
                  type: array
                  minItems: 0
                  maxItems: 10000
                  items: 
                    default: []
                    type: integer
                    minimum: 1
                    maximum: 10000
                    example: 1
      responses:
        "200":
          description: "group create successfully"
          content:
            application/json:
              schema:
                description: "return id group"
                type: object
                properties:
                  id_group: 
                    type: integer
                    minimum: 1
                    maximum: 10000
                    example: 124
        "400":
          $ref: "#/components/responses/Bad_Input"
        "401":
          $ref: "#/components/responses/401_Unauthorized"
        "500":
          $ref: "#/components/responses/500_ISE"
  /conversation/leave/{idChat}:
    delete:
      tags: ["conversation"]
      security:
        - bearerAuth: []
      summary: "Leave a group"
      description: "Leave a group by logged user"
      operationId: leaveGroup
      parameters:
        - name: idChat
          in: path
          required: true
          description: "group identifier"
          schema:
            type: integer
            minimum: 1
            maximum: 10000
            example: 1
      responses:
        "204":
          $ref: "#/components/responses/204_NoContent"
        "400":
          $ref: "#/components/responses/Bad_Input"
        "401":
          $ref: "#/components/responses/401_Unauthorized"
        "500":
          $ref: "#/components/responses/500_ISE"
  /conversation/group/name:
    put:
      tags: ["conversation"]
      security:
        - bearerAuth: []
      operationId: setGroupName
      summary: "modify group name"
      description: "if the user belong to the group modify the group name, otherwise return an error"
      requestBody:
        description: "take group id and chat name"
        content:
          application/json: 
            schema:
              $ref: "#/components/schemas/Group"
      responses:
        "204":
          $ref: "#/components/responses/204_NoContent"
        "400":
          $ref: "#/components/responses/Bad_Input"
        "401":
          $ref: "#/components/responses/401_Unauthorized"
        "500":
          $ref: "#/components/responses/500_ISE"              
  /conversation/group/user:
    put:
      tags: ["conversation"]
      security:
        - bearerAuth: []
      operationId: addToGroup
      summary: "add user to group"
      description: "if the user belong to the group add the user/s to the group, otherwise return an error"
      requestBody:
        description: "take the group id and chat memebers to add"
        content:
          application/json: 
            schema:
              description: "new group member/s and chat id"
              type: object
              properties:
                Membri:
                  description: "new group member/s(id)"
                  type: array
                  minItems: 1
                  maxItems: 10000
                  items:
                    default: []
                    type: integer
                    minimum: 1
                    maximum: 10000
                    example: 1
                idChat:
                  type: integer
                  description: "chat id to the group that is needed to add members"
                  minimum: 1
                  maximum: 10000
                  example: 1   
      responses:
        "204":
          $ref: "#/components/responses/204_NoContent"
        "400":
          $ref: "#/components/responses/Bad_Input"
        "401":
          $ref: "#/components/responses/401_Unauthorized"
        "500":
          $ref: "#/components/responses/500_ISE"            
  /conversation/group/photo:
    put:
      tags: ["conversation"]
      security:
        - bearerAuth: []
      operationId: setGroupPhoto
      summary: "set group photo"
      description: "if the user belong to the group set the group photo, otherwise return an error"
      requestBody:
        description: "take the group id and the photo"
        content:
          multipart/form-data:
            schema:
              description: "new photo and chat id"
              type: object
              properties:
                propic:
                  description: "the photo that will be set" 
                  type: string
                  format: byte
                idChat:
                  type: integer
                  description: "chat id to the group that is needed to change photo"
                  minimum: 1
                  maximum: 10000
                  example: 1   
      responses:
        "204":
          $ref: "#/components/responses/204_NoContent"
        "400":
          $ref: "#/components/responses/Bad_Input"
        "401":
          $ref: "#/components/responses/401_Unauthorized"
        "500":
          $ref: "#/components/responses/500_ISE"        
  /message:
    post: 
      tags: ["messages"]
      security:
        - bearerAuth: []
      operationId: sendMessages
      summary: "send a message"
      description: "send a message if the user belong to the chat, otherwise return an error"
      requestBody:
        description: "message data"
        content:
          multipart/form-data:  
            schema:
              type: object
              properties:
                photo:
                  description: "photo of the message to be sent"
                  type: string 
                  format: byte
                id_chat:
                  description: "chat id where the message should be sent"
                  type: integer
                  minimum: 1
                  maximum: 10000
                  example: 1
                testo: 
                  description: "message text"
                  type: string
                  minLength: 0
                  maxLength: 10000
                  example: "ciao, sono alessio"
                id_reply:
                  description: "the id of the message we are replying to"
                  type: integer
                  minimum: 1
                  maximum: 10000
                  example: 1
      responses:
        "204":
          $ref: "#/components/responses/204_NoContent"
        "400":
          $ref: "#/components/responses/Bad_Input"
        "401":
          $ref: "#/components/responses/401_Unauthorized"
        "500":
          $ref: "#/components/responses/500_ISE"
  /message/forward:
    post: 
      tags: ["messages"]
      security:
        - bearerAuth: []
      operationId: forwardMessage
      summary: "forward a message"
      description: "forward the message if the logged in user has access to the message and the sending chat "
      requestBody:
        description: "information for forward the message"
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                idChat: 
                  description: "chat id where the message will be sent"
                  type: array
                  minItems: 1
                  maxItems: 10000
                  items:
                    type: integer
                    minimum: 1
                    maximum: 10000
                    example: 1
                IdMes:
                  type: integer
                  description: "message id"
                  minimum: 1
                  maximum: 10000
                  example: 1
                IdForward: 
                  description: "forward id(the message it refers to)"
                  type: integer
                  minimum: 1
                  maximum: 10000
                  example: 1
      responses:
        "204":
          $ref: "#/components/responses/204_NoContent"
        "400":
          $ref: "#/components/responses/Bad_Input"
        "401":
          $ref: "#/components/responses/401_Unauthorized"
        "500":
          $ref: "#/components/responses/500_ISE"
  /message/comment:
    post:
      tags: ["messages"]
      security:
        - bearerAuth: []
      operationId: commentMessage
      summary: "comment a message"
      description: "comment the message if the logged in user has access to the message, and if he has already entered the comment he changes it(if you click the comment already inserted it removes the comment)"
      requestBody:
        description: "information for comment the message"
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                id_chat: 
                  description: "chat id where the message will be commented"
                  type: integer
                  minimum: 1
                  maximum: 10000
                  example: 1
                Id_mes:
                  type: integer
                  description: "message id of the message that will be commented"
                  minimum: 1
                  maximum: 10000
                  example: 1
                Emoji: 
                  description: "the effective comment to the message"
                  type: string
                  maxLength: 1
                  minLength: 1
                  pattern: ^(👠|❤️|👍🏻|👌🏻|💅)$
                  example: "❤️"
      responses:
        "204":
          $ref: "#/components/responses/204_NoContent"
        "400":
          $ref: "#/components/responses/Bad_Input"
        "401":
          $ref: "#/components/responses/401_Unauthorized"
        "500":
          $ref: "#/components/responses/500_ISE"      
  /message/uncomment:
    post:
      tags: ["messages"]
      security:
        - bearerAuth: []
      operationId: uncommentMessage
      summary: "uncomment a message"
      description: "uncomment the message if the logged in user has access to the message"
      requestBody:
        description: "information for comment the message"
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                id_chat: 
                  description: "chat id where the message will be uncommented"
                  type: integer
                  minimum: 1
                  maximum: 10000
                  example: 1
                Id_mes:
                  type: integer
                  description: "message id of the message that will be uncommented"
                  minimum: 1
                  maximum: 10000
                  example: 1
      responses:
        "204":
          $ref: "#/components/responses/204_NoContent"
        "400":
          $ref: "#/components/responses/Bad_Input"
        "401":
          $ref: "#/components/responses/401_Unauthorized"
        "500":
          $ref: "#/components/responses/500_ISE"
  /message/delete/{idMes}:
    delete:
      tags: ["message"]
      security:
        - bearerAuth: []
      summary: "delete a message"
      description: "check the existence of the message and if it exists delete it(if it's forwarded delete only the chat instance)"
      operationId: deleteMessage
      parameters:
        - name: idMes
          in: path
          required: true
          description: "message id"
          schema:
            type: integer
            minimum: 1
            maximum: 10000
            example: 1
      requestBody:
        description: "information for delete the message"
        content:
          application/json: 
            schema:
              type: object
              properties:
                IdChat: 
                  description: "chat id where the message will be deleted"
                  type: integer
                  minimum: 1
                  maximum: 10000
                  example: 1
                IdForward:
                  type: integer
                  description: "id of the forward of the message"
                  minimum: 1
                  maximum: 10000
                  example: 1
      
      responses:
        "204":
          $ref: "#/components/responses/204_NoContent"
        "400":
          $ref: "#/components/responses/Bad_Input"
        "401":
          $ref: "#/components/responses/401_Unauthorized"
        "500":
          $ref: "#/components/responses/500_ISE"
components:
  schemas:
    id: 
      description: "user id"
      type: integer
      minimum: 1
      maximum: 10000
      example: 1
    username:
      description: "user username"
      type: string
      minLength: 1
      maxLength: 16
      example: pippo
      pattern: ^[a-zA-Z0-9]+$
    propic:
      description: "user profile photo"
      type: string
      format: binary
    user:
      description: "type user object with username, id and propic inside"
      type: object
      properties:
        id:
          $ref: "#/components/schemas/id"
        username:
          $ref: "#/components/schemas/username"
        propic:
          $ref: "#/components/schemas/propic"
    Group:
      type: object
      properties:
        NomeChat:
          description: "chat name"
          type: string
          maxLength: 16
          minLength: 1
          example: "pluto"
        Propric:
          description: "group propic"
          type: string
          format: byte
        Membri:
          description: "group members id"
          type: array
          items:
            type: integer
            minimum: 1
            maximum: 10000
            example: 1
        IdChat:
          description: "chat(group) id"
          type: integer
          minimum: 1
          maximum: 10000
          example: 1
    ChatUtente:
      type: object
      properties:
        IdChat:
          description: "chat id"
          type: integer
          minimum: 1
          maximum: 10000
          example: 1
        Nome:
          description: "chat name"
          type: string
          maxLength: 16
          minLength: 1
          example: "pippo"
        Gruppo:
          description: "true if the chat is a group, otherwise false"
          type: boolean
          example: true
        Username:
          description: "user username who has send the last message to the chat"
          type: string
          maxLength: 16
          minLength: 1
          example: "paolino"
        Id: 
          description: "user id who has send the last message to the chat"
          type: integer
          minimum: 1
          maximum: 10000
          example: 1
        Propic:
          description: "chat profile picture"
          type: string
          format: byte
        LastMsg:
          description: "last message text"
          type: string
          maxLength: 100
          minLength: 0
          example: "ciao come ti chiami?$"
        Data:
          description: "last message date"
          type: string
          format: date-time
          example: "2021-06-01T10:00:00Z"
    Mess:
      type: object
      properties:
        IdMess:
          description: "message id"
          type: integer
          minimum: 1
          maximum: 10000
          example: 1
        Nome:
          description: "sender username"
          type: string 
          minLength: 1
          maxLength: 16
          example: "pippo"
        IdMitt:
          description: "sender id"
          type: integer
          minimum: 1
          maximum: 10000
          example: 1 
        Testo:
          description: "message text"
          type: string
          minLength: 0
          maxLength: 10000
          example: "ciao, sono pippo"
        Data:
          description: "date of message sent"
          type: string
          format: date-time
          example: "2021-06-01T10:00:00Z"
        Visual:
          description: "if the message was viewed"
          type: boolean 
          example: true
        Photo:
          description: "photo in send message"
          type: string
          format: byte
        IdChat:
          description: "chat id"
          type: integer
          minimum: 1
          maximum: 10000
          example: 1
        Gruppo:
          description: "if the message belongs to a group"
          type: boolean
          example: true
        Emoji:
          description: "array of 5 elements, the number of each indicates how many emojis that message has for each type of emoji"
          type: array
          items:
            type: integer
        MyEmoji:
          description: "indicates the emoji of the user logged in to that message"
          type: string
          minLength: 1
          maxLength: 30
          example: "❤️"
        ForwardUsername:
          description: "username of the user who created the message to be forwarded"
          type: string
          minLength: 1
          maxLength: 16
          example: "pippo"
        ForwardId:
          description: "id of the user who created the message to be forwarded"
          type: integer
          minimum: 1
          maximum: 10000
          example: 1
        ForwardDate:
          description: "forward date"
          type: string
          format: date-time
          example: "2021-06-01T10:00:00Z"
        ForwardIdMit: 
          description: "id of the person who made the forward"
          type: integer
          minimum: 1
          maximum: 10000
          example: 1
        ForwardUsernameMit:
          description: "username of the person who made the forward"
          type: string
          minLength: 1
          maxLength: 16
          example: "pippo"
        IdForward:
          description: "id of forward"
          type: integer
          minimum: 1
          maximum: 10000
          example: 1
        IdReply:
          description: "id of reply"
          type: integer
          minimum: 1
          maximum: 10000
          example: 1
        TestoReply:
          description: "text of reply message"
          type: string
          minLength: 1
          maxLength: 10000
          example: "ciao amico mio, come stai?"
        IdMitReply:
          description: "id reply sender"
          type: integer
          minimum: 1
          maximum: 1000
          example: 1
        MitReply:
          description: "username reply sender"
          type: string
          minLength: 1
          maxLength: 16
          example: "pippo"
        PhotoReply:
          description: "photo in reply message"
          type: string
          format: byte

      
  responses:

    Bad_Input:
      description: "error in log in"
      content:
        application/json:
          schema:
            description: "return an error"
            type: object
            properties:
              error: 
                type: string
                minLength: 1
                maxLength: 1000
                example: "error in data structure"
    204_NoContent:
      description: No content, operation successful

    401_Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            description: Unauthorized response
            type: object
            properties:
              message:
                description: Unauthorized message
                type: string
